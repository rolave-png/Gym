<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>🏋️ Gym Tracker</h1><input type="date" id="date"><button class="link" id="setBtn" title="Ajustes">⚙️</button></header>
<main>
  <section id="tab-hoy">
    <div class="card summary">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="bg"/><circle id="arc" cx="60" cy="60" r="52" class="fg"/></svg>
        <div class="ring-text"><b id="total">0</b><small>de <span id="goal">2200</span> kcal</small></div></div>
      <div class="macros">
        <div><b id="mp">0</b>g<small>Proteína</small></div>
        <div><b id="mc">0</b>g<small>Carbs</small></div>
        <div><b id="mf">0</b>g<small>Grasa</small></div>
      </div>
    </div>

    <div class="card">
      <h2>Añadir comida</h2>
      <div class="row">
        <label class="btn primary">📷 Hacer / subir foto<input type="file" id="photo" accept="image/*" hidden></label>
        <button class="btn" id="searchBtn">🔎 Buscar alimento</button>
      </div>
      <input id="note" placeholder="Nota opcional (ej. 'ración grande', 'sin aceite')">
      <p id="status" class="muted"></p>
    </div>

    <div id="meals"></div>
      </section>

  <section id="tab-rutina" hidden>
    <div class="days" id="days"></div>
    <div id="progress" class="progress" hidden><div class="track"><div id="progBar"></div></div><p id="progText" class="muted"></p></div>
    <div class="card">
      <input id="dayName" class="title-input" placeholder="Nombre del día (ej. Pecho y tríceps)">
      <div id="exercises"></div>
      <form id="exForm" class="exform">
        <input id="exName" list="exList" placeholder="Ejercicio" required>
        <input id="exSets" type="number" min="1" placeholder="Series">
        <input id="exReps" placeholder="Reps">
        <input id="exWeight" placeholder="Kg">
        <button class="btn primary">+</button>
      </form>
    </div>
    <p class="muted center"><button class="link" id="presetBtn">Cargar la rutina sugerida (3 días + bici)</button> · <button class="link" id="emptyBtn">Empezar una rutina vacía</button></p>
  </section>

  <section id="tab-bienestar" hidden>
    <p class="muted center" id="bDay"></p>
    <div class="card" id="breathCard">
      <h2>🫁 Respiración</h2>
      <p class="muted" id="bStreak"></p>
      <div id="bSetup">
        <p class="muted" style="margin:0 0 6px">¿Cuándo?</p><div class="chips-row" id="bChips"></div>
        <p class="muted" style="margin:12px 0 6px">Técnica</p><div class="pats" id="bPats"></div>
        <p class="muted" style="margin:12px 0 6px">Duración</p><div class="chips-row" id="bMins"></div>
        <button class="btn primary wide" id="bStart">Empezar a respirar</button>
        <p class="center"><button class="link" data-act="toggleslot">Marcar / desmarcar este momento sin hacer la sesión</button></p>
      </div>
      <div id="bStage" hidden>
        <div class="orb"><div class="orb-in" id="orb"></div><div class="orb-txt"><b id="bPhase"></b><span id="bCount"></span></div></div>
        <p class="center muted" id="bLeft"></p>
        <button class="btn wide" id="bStop">Terminar</button>
      </div>
      <p class="tip" id="bMsg" aria-live="polite"></p>
    </div>
    <div class="card" id="readCard"></div>
  </section>

  <section id="tab-progreso" hidden>
    <div class="card"><h2>Calorías (últimos días)</h2><div id="chart"></div></div>
  </section>
</main>
<nav>
  <button data-tab="hoy" class="active">🍽️<span>Hoy</span></button>
  <button data-tab="rutina">💪<span>Rutina</span></button>
  <button data-tab="bienestar">🧘<span>Bienestar</span></button>
  <button data-tab="progreso">📈<span>Progreso</span></button>
</nav>
<dialog id="dlg"><form method="dialog" id="foodForm">
  <h2>Buscar alimento</h2>
  <input id="q" placeholder="Ej. arroz, pollo, pizza…" autocomplete="off">
  <div id="results"></div>
  <div id="pick" hidden>
    <p><b id="pickName"></b><br><small class="muted" id="pickInfo"></small></p>
    <input id="grams" type="number" min="1" value="100" placeholder="Gramos">
    <p>= <b id="pickKcal"></b> kcal</p>
    <button class="btn primary" id="addFood" value="ok">Añadir</button>
  </div>
  <div class="row" style="margin-top:10px"><button class="btn" value="cancel">Cerrar</button><button class="btn" type="button" id="freeBtn">Poner kcal a mano</button></div>
</form></dialog>
<dialog id="bkDlg"><form method="dialog" id="bkForm">
  <h2>Mi libro</h2>
  <label class="muted">Título</label><input id="bkTitle" required>
  <label class="muted">Autor (opcional)</label><input id="bkAuthor">
  <div class="row3"><div><label class="muted">Páginas totales</label><input id="bkTotal" type="number" min="1" inputmode="numeric" required></div>
    <div><label class="muted">Voy en la página</label><input id="bkNow" type="number" min="0" inputmode="numeric"></div>
    <div><label class="muted">Meta: pág./día</label><input id="bkGoal" type="number" min="1" inputmode="numeric"></div></div>
  <label class="muted">O quiero terminarlo antes del (opcional, calcula tu meta)</label><input id="bkTarget" type="date">
  <div class="row" style="margin-top:12px"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" value="ok">Guardar</button></div>
</form></dialog>
<datalist id="exList"></datalist>
<dialog id="guideDlg" class="guide"><div id="guideBody"></div><button class="btn wide" id="guideClose">Cerrar</button></dialog>
<dialog id="edDlg"><form method="dialog" id="edForm">
  <h2>Editar ejercicio</h2>
  <label class="muted">Nombre</label><input id="edName">
  <div class="row3"><div><label class="muted">Series</label><input id="edSets" type="number" min="1"></div><div><label class="muted">Reps</label><input id="edReps"></div><div><label class="muted">Kg</label><input id="edWeight"></div></div>
  <div class="row" style="margin-top:12px"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" value="ok">Guardar</button></div>
</form></dialog>
<dialog id="setDlg"><form method="dialog" id="setForm">
  <h2>Ajustes</h2>
  <label class="muted">Objetivo diario (kcal)</label>
  <input id="setGoal" type="number" min="500" max="9999">
  <label class="muted">Clave de Gemini (gratis en aistudio.google.com/apikey)</label>
  <input id="setKey" type="password" placeholder="Se guarda solo en este móvil" autocomplete="off">
  <label class="muted">Modelo (déjalo vacío para elegir automáticamente)</label>
  <input id="setModel" placeholder="automático">
  <div class="row" style="margin-top:12px"><button class="btn" type="button" id="expBtn">⬇️ Exportar datos</button>
    <label class="btn">⬆️ Importar<input type="file" id="impFile" accept="application/json" hidden></label></div>
  <div class="row"><button class="btn" value="cancel">Cerrar</button><button class="btn primary" value="ok">Guardar</button></div>
</form></dialog>
<script src="guia.js"></script>
<script src="app.js"></script>
<script src="bienestar.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})</script>
</body>
</html>
